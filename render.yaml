# Render blueprint: the app in the browser (app.atrionovo.com),
# for owners who want to work on a laptop.
services:
  - type: web
    name: atrionovo-web-app
    runtime: static
    buildCommand: npm install -g pnpm@9.1.3 && pnpm install --frozen-lockfile && npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://atrionovo-receptionist-backend.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Every page is the same app; it picks the screen itself.
      - type: rewrite
        source: /*
        destination: /index.html
